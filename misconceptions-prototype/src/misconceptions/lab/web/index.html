<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AAI Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Bỏ qua điều hướng</a>
<div class="shell">
  <header class="rail">
    <a class="brand" href="#/lop" aria-label="AAI Lab, về Lớp học">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="6"/><path d="M8 16.5 12 7.5l4 9M9.6 13h4.8"/></svg>
      <span>AAI Lab</span>
    </a>
    <nav class="nav" aria-label="Chính">
      <a href="#/lop" data-route="lop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.7-3 3-4.6 5.5-4.6s4.8 1.6 5.5 4.6"/><path d="M15.5 5.3a3 3 0 0 1 0 5.4M17.8 14.6c1.3.6 2.3 2 2.7 4.4"/></svg>
        <span>Lớp học</span></a>
      <a href="#/chay-thu" data-route="chay-thu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>
        <span>Chạy thử</span></a>
      <a href="#/c-pack" data-route="c-pack">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/></svg>
        <span class="nav-long">Dữ liệu C-Pack</span><span class="nav-short" aria-hidden="true">C-Pack</span></a>
      <a href="#/nghien-cuu" data-route="nghien-cuu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M7 16V11M12 16V6M17 16v-3"/></svg>
        <span>Nghiên cứu</span></a>
    </nav>
    <p class="runner" id="runner" role="status"><span class="dot" aria-hidden="true"></span><span class="runner-text">Đang kiểm tra Docker</span></p>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<p id="announce" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
